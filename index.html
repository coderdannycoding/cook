<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pandemonium Bistro — Kitchen Chaos Tycoon</title>
  <meta name="description" content="A frantic isometric cooking & restaurant tycoon game built with Three.js. Cook, serve, build and expand.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/hud.css">
  <link rel="stylesheet" href="styles/panels.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="world-ui"></div>
  <div id="floaters"></div>
  <div id="fire-vignette"></div>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="hud-box glass day-box">
        <div class="hud-day-row"><span id="hud-sun">☀️</span><b id="hud-day">Day 1</b><span id="hud-clock">10:00 AM</span></div>
        <div class="clock-bar"><div id="hud-clock-fill"></div></div>
      </div>
      <div id="hud-cash-box" class="hud-box glass cash-box"><span class="ico">💰</span><b id="hud-cash">$0</b></div>
      <div id="hud-stars-box" class="hud-box glass stars-box">
        <div id="hud-stars"></div>
        <small id="hud-next"></small>
      </div>
      <div class="hud-box glass amb-box" title="Ambience: décor makes guests more patient and generous"><span class="ico">✨</span><b id="hud-amb">0%</b><small>ambience</small></div>
    </div>
    <div id="tickets"></div>
    <div class="hud-right">
      <div id="hud-dash" class="dash-ring" title="Dash (Shift / Space)"><span>💨</span></div>
      <button id="btn-mute" class="icon-btn glass" title="Mute">🔊</button>
      <button id="btn-pause" class="icon-btn glass" title="Pause (Esc)">⏸</button>
    </div>
  </div>

  <div id="prompt" class="glass hidden"></div>
  <div id="hint" class="glass hidden"></div>
  <div id="toasts"></div>
  <div id="countdown"></div>
  <div id="build-help" class="glass hidden"></div>
  <div id="night-dock" class="glass hidden"></div>
  <div id="title-screen" class="hidden"></div>
  <div id="modal-root"></div>

  <div id="loading">
    <div class="load-card">
      <div class="load-logo">🍳</div>
      <div class="load-title">Pandemonium Bistro</div>
      <div class="load-bar"><div class="load-fill"></div></div>
      <div class="load-text">Loading…</div>
    </div>
  </div>

  <noscript>This game needs JavaScript (and WebGL) to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
