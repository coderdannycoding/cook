<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pandemonium Bistro</title>
  <meta name="description" content="Run a small, chaotic restaurant: cook every order by hand during service, then rebuild the kitchen, hire staff and add new cuisines after closing.">
  <meta name="theme-color" content="#1f2d28">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pandemonium Bistro">
  <meta property="og:description" content="Cook every order by hand during service, then rebuild the kitchen after closing. A restaurant game that runs in your browser.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Pandemonium Bistro">
  <meta name="twitter:description" content="Cook every order by hand during service, then rebuild the kitchen after closing. A restaurant game that runs in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M20 11l9-8' stroke='%23241a14' stroke-width='4.5' stroke-linecap='round'/%3E%3Ccircle cx='13' cy='18' r='11' fill='%23241a14'/%3E%3Ccircle cx='13' cy='18' r='7.5' fill='%23fbf4e4'/%3E%3Ccircle cx='13' cy='18' r='3.4' fill='%23f0b43c'/%3E%3C/svg%3E">
  <link rel="preload" href="vendor/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/shrikhand-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="vendor/three-0.169.0.module.min.js">
  <link rel="modulepreload" href="src/main.js">
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/hud.css">
  <link rel="stylesheet" href="styles/panels.css">
  <link rel="stylesheet" href="styles/touch.css">
</head>
<body>
  <canvas id="game" aria-label="Pandemonium Bistro game view"></canvas>
  <div id="world-ui"></div>
  <div id="floaters"></div>
  <div id="fire-vignette"></div>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="hud-box paper day-box">
        <div class="hud-day-row"><span id="hud-sun"></span><b id="hud-day">Day 1</b><span id="hud-clock">10:00 AM</span></div>
        <div class="clock-bar"><div id="hud-clock-fill"></div></div>
      </div>
      <div id="hud-cash-box" class="hud-box cash-box" title="Money in the till"><span class="ico" data-icon="coin"></span><b id="hud-cash">$0</b></div>
      <div id="hud-stars-box" class="hud-box paper stars-box">
        <div id="hud-stars"></div>
        <small id="hud-next"></small>
      </div>
    </div>
    <div id="tickets"></div>
    <div class="hud-right">
      <div id="hud-dash" class="dash-ring" title="Dash (Shift / Space)"><span data-icon="wind"></span></div>
      <button id="btn-fullscreen" class="icon-btn paper hidden" title="Fullscreen" aria-label="Toggle fullscreen" data-icon="fullscreen"></button>
      <button id="btn-mute" class="icon-btn paper" title="Mute" aria-label="Toggle sound" data-icon="sound"></button>
      <button id="btn-pause" class="icon-btn paper" title="Pause (Esc)" aria-label="Pause" data-icon="pause"></button>
    </div>
  </div>

  <div id="prompt" class="board hidden"></div>
  <div id="hint" class="paper hidden"></div>
  <div id="toasts"></div>
  <div id="countdown"></div>
  <div id="build-help" class="board hidden"></div>
  <div id="build-tools" class="hidden"></div>
  <div id="night-dock" class="board hidden"></div>
  <div id="touch-ui" class="hidden"></div>
  <div id="rotate-hint" class="board hidden"><span data-icon="rotate"></span>Turn your phone sideways for a wider view</div>
  <div id="title-screen" class="hidden"></div>
  <div id="modal-root"></div>

  <div id="loading">
    <div class="load-card">
      <div class="load-logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="13.5" r="6.3"/><path d="M14.3 9.2l6.5-5.7" stroke-width="2.8"/></svg></div>
      <div class="load-title">Pandemonium Bistro</div>
      <div class="load-bar"><div class="load-fill"></div></div>
      <div class="load-text">Loading</div>
    </div>
  </div>

  <noscript><div class="fatal">Pandemonium Bistro needs JavaScript and WebGL to run.</div></noscript>
  <script src="src/boot-guard.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
